<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Host Admin — Little Pumpkin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main style="max-width:760px">
  <section class="card dark">
    <h2>Host Admin 🎃</h2>
    <div class="row-form" id="host-login-row">
      <input type="email" id="host-email" placeholder="you@email.com" />
      <button class="btn btn-small" id="host-login">Email me a login link</button>
      <button class="btn btn-small btn-ghost hidden" id="export-csv">Export RSVPs CSV</button>
      <button class="btn btn-small btn-ghost hidden" id="host-logout">Log out</button>
    </div>
    <p class="muted" id="host-status">Log in with your email to view the guest list.</p>
    <div id="admin-panel" class="hidden">
      <h3 id="rsvp-stats"></h3>
      <div id="admin-rsvps"></div>
    </div>
    <p class="muted"><a href="./" style="color:#ffd9a8">← Back to site</a></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
